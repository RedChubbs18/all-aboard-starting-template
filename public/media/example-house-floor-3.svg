<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Example House, Floor 3 plan</title>
  <desc id="d">Example floor plan (demo). Reception and lifts on the left, the Digital Workplace Engineering team area in the centre, the kitchen and meeting rooms on the right. A marker shows where you meet at reception.</desc>
  <rect width="800" height="520" fill="#f4f7f5"/>
  <rect x="20" y="20" width="760" height="440" rx="6" fill="#ffffff" stroke="#00453a" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#13322b" text-anchor="middle">
    <rect x="40" y="40" width="190" height="200" fill="#e2f1ea" stroke="#006a4d" stroke-width="2"/>
    <text x="135" y="140" font-weight="700" font-size="18">Reception</text>
    <rect x="75" y="160" width="120" height="26" rx="4" fill="#006a4d"/>
    <text x="135" y="178" fill="#ffffff" font-size="13">Welcome desk</text>
    <rect x="40" y="260" width="190" height="90" fill="#eef0ef" stroke="#6b7b76" stroke-width="2"/>
    <text x="135" y="298" font-weight="700">Lifts</text>
    <text x="135" y="320" font-size="13">North core</text>
    <rect x="40" y="370" width="190" height="70" fill="#eef0ef" stroke="#6b7b76" stroke-width="2"/>
    <text x="135" y="410">Stairs and quiet room</text>
    <rect x="250" y="40" width="300" height="270" fill="#d4ece1" stroke="#006a4d" stroke-width="2"/>
    <text x="400" y="70" font-weight="700" font-size="18">Digital Workplace</text>
    <text x="400" y="92" font-weight="700" font-size="18">Engineering</text>
    <g fill="#ffffff" stroke="#006a4d" stroke-width="1.5">
      <rect x="275" y="120" width="60" height="38" rx="4"/><rect x="345" y="120" width="60" height="38" rx="4"/>
      <rect x="415" y="120" width="60" height="38" rx="4"/><rect x="485" y="120" width="45" height="38" rx="4"/>
      <rect x="275" y="180" width="60" height="38" rx="4"/><rect x="345" y="180" width="60" height="38" rx="4"/>
      <rect x="415" y="180" width="60" height="38" rx="4"/><rect x="485" y="180" width="45" height="38" rx="4"/>
      <rect x="275" y="240" width="60" height="38" rx="4"/><rect x="345" y="240" width="60" height="38" rx="4"/>
    </g>
    <text x="470" y="265" font-size="13">Team desks</text>
    <rect x="570" y="40" width="190" height="130" fill="#fff4dc" stroke="#b07d00" stroke-width="2"/>
    <text x="665" y="100" font-weight="700" font-size="18">Kitchen</text>
    <text x="665" y="124" font-size="13">and cafe</text>
    <rect x="570" y="190" width="90" height="120" fill="#e8eefb" stroke="#2b4c9b" stroke-width="2"/>
    <text x="615" y="245" font-weight="700">Kestrel</text><text x="615" y="265" font-size="13">Meeting</text>
    <rect x="670" y="190" width="90" height="120" fill="#e8eefb" stroke="#2b4c9b" stroke-width="2"/>
    <text x="715" y="245" font-weight="700">Heron</text><text x="715" y="265" font-size="13">Meeting</text>
    <rect x="250" y="330" width="300" height="110" fill="#e8eefb" stroke="#2b4c9b" stroke-width="2"/>
    <text x="400" y="380" font-weight="700" font-size="18">Wren</text><text x="400" y="402" font-size="13">Large meeting room</text>
    <rect x="570" y="330" width="190" height="110" fill="#eef0ef" stroke="#6b7b76" stroke-width="2"/>
    <text x="665" y="390">Tech bar drop-in</text>
    <g>
      <rect x="62" y="52" width="146" height="28" rx="14" fill="#e4002b"/>
      <text x="135" y="71" fill="#ffffff" font-weight="700" font-size="14">You meet here</text>
      <circle cx="135" cy="105" r="12" fill="#e4002b"/>
      <circle cx="135" cy="105" r="4" fill="#ffffff"/>
    </g>
  </g>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00453a">Example floor plan (demo)</text>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52635d">Example House, Floor 3. Fictional.</text>
